name: my5top
description: "my5top — Cute/Anime NJ Transit Commute Assistant with hybrid GPS + API stop tracking, Mihon-style JSON backups, and GitHub APK self-updates."
version: 1.0.3+4

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local NoSQL Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  provider: ^6.1.2

  # Location & Station Geofencing
  geolocator: ^10.1.0

  # HTTP Client (NJ Transit API, DepartureVision, GitHub Releases)
  http: ^1.2.1

  # External Links
  url_launcher: ^6.2.5

  # Local Paths & APK Installer
  path_provider: ^2.1.2
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
