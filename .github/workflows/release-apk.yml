name: Build & Release my5top APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Release APK (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version & Release Metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            RAW_VER=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | tr -d '[:space:]')
            CLEAN_VER=$(echo "$RAW_VER" | cut -d'+' -f1)
            TAG_NAME="v${CLEAN_VER}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          RELEASE_TITLE="${TAG_NAME}"
          > /tmp/release_body.md
          if [ -f release_notes.md ]; then
            FIRST_LINE=$(head -n1 release_notes.md | sed -E 's/^#+[[:space:]]*//')
            if [ -n "$FIRST_LINE" ]; then
              RELEASE_TITLE="$FIRST_LINE"
            fi
            tail -n +2 release_notes.md | sed '/./,$!d' > /tmp/release_body.md
          fi
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Free Runner Disk Space for Android NDK
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/ndk" ]; then
            find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 ! -name "28.2*" -exec sudo rm -rf {} +
          fi
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold missing platform files (if needed) & Get dependencies
        run: |
          flutter create --platforms=android --org com.my5top .
          rm -f test/widget_test.dart
          flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK with Version Tag
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "my5top-${TAG_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my5top-release-apk
          path: my5top-*.apk

      - name: Sync Git Tag to Latest Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "refs/tags/${TAG_NAME}" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          body_path: /tmp/release_body.md
          files: my5top-*.apk
