name: Build & Release my5top APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Release APK (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold missing platform files (if needed) & Get dependencies
        run: |
          flutter create --platforms=android --org com.my5top .
          rm -f test/widget_test.dart
          flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK with Version Tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          cp build/app/outputs/flutter-apk/app-release.apk "my5top-${TAG_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my5top-release-apk
          path: my5top-*.apk

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: my5top-*.apk
          generate_release_notes: true
